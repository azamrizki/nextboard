version: 2
project_name: nextboard

before:
  hooks:
    - make web

builds:
  - id: nextboard
    main: ./cmd/nextboard
    binary: nextboard
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/azamrizki/nextboard/internal/version.Version={{ .Version }}
      - -X github.com/azamrizki/nextboard/internal/version.Repo={{ envOrDefault "GITHUB_REPOSITORY" "azamrizki/nextboard" }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - install.sh

# A tag such as v0.4.0-beta.1 is a pre-release on GitHub, so it never becomes "latest", which is
# what `nextboard update` and install.sh install.
release:
  prerelease: auto

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\(.+\))?!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?(fix|perf|revert)(\(.+\))?!?:.+$'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^.*?(docs|test|ci|chore)(\(.+\))?:.+$'

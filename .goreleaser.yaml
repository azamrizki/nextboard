version: 2
project_name: nextboard

before:
  hooks:
    - make web

builds:
  - id: nextboard
    main: ./cmd/nextboard
    binary: nextboard
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/azamrizki/nextboard/internal/version.Version={{ .Version }}
      - -X github.com/azamrizki/nextboard/internal/version.Repo={{ envOrDefault "GITHUB_REPOSITORY" "azamrizki/nextboard" }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - install.sh

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc

name: release

# Started by hand when there is something to release, and the only time CI runs:
# Actions > release > Run workflow, or `gh workflow run release.yml`. Tick dry_run to
# run the tests and see which version would come out, without publishing anything.
#
# The commit messages since the last tag decide the version: see .releaserc.json.
#
# A beta: bring the beta branch up to main (`git push origin main:beta`), then run this on it
# (`gh workflow run release.yml --ref beta`). It is tagged vX.Y.Z-beta.N and published as a
# pre-release, which `nextboard update` and install.sh leave alone unless asked for by tag.
#
# The checks run side by side, each on its own runner, and the release job starts only once all
# of them passed, so nothing is tagged or published before that. The slow Go packages are split
# by test name over several runners (scripts/ci-shard.sh). On a branch other than main and beta
# only the checks run.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the tests and show the next version, publish nothing
        type: boolean
        default: false

permissions:
  contents: read

# bash with pipefail, so a failing command at the head of a pipe fails the step
defaults:
  run:
    shell: bash

jobs:
  web:
    name: web build and vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - run: make test-web

  # Every package but the ones the shard job splits, dealt out by package over two runners. The
  # hub is tested with the web bundle in place, as it ships.
  go:
    name: go test, other packages ${{ matrix.part }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    steps:
      - uses: actions/checkout@v4
      # setup-go's cache, one key per go.sum: only the race jobs use it, so the race build of the
      # standard library and the modules is what it keeps.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      # The packages left out are read from the shard job's matrix, so a package taken off it is
      # tested here again.
      - run: |
          split=$(grep -oE '\{ pkg: \./[^,]+' .github/workflows/release.yml | sed 's/.*pkg: \.\///' | sort -u)
          pkgs=$(go list ./... | grep -vxF -f <(sed "s|^|$(go list -m)/|" <<<"$split") |
            awk -v k=${{ strategy.job-index }} -v n=${{ strategy.job-total }} '(NR - 1) % n == k')
          echo "left to the shards: $(echo $split)"
          echo "this part: $(echo $pkgs)"
          # Built first, as ci-shard.sh does for the shards, so the tests do not share the runner
          # with the compiler: a few of them time a debounced save or a timeout.
          go test -race -c -o "$RUNNER_TEMP/tests/" $pkgs >/dev/null
          NEXTBOARD_SSHD_TEST=1 go test -race -count=1 -timeout 30m $pkgs

  # internal/server alone took 612 s of the race run at v0.10.0, internal/machine 195 s: each is
  # dealt out by test name over a few runners. ci-shard.sh checks that the shards together hold
  # every test of the package once.
  shard:
    name: go test ${{ matrix.pkg }} ${{ matrix.shard }}/${{ matrix.shards }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: ./internal/server, shards: 8, shard: 1 }
          - { pkg: ./internal/server, shards: 8, shard: 2 }
          - { pkg: ./internal/server, shards: 8, shard: 3 }
          - { pkg: ./internal/server, shards: 8, shard: 4 }
          - { pkg: ./internal/server, shards: 8, shard: 5 }
          - { pkg: ./internal/server, shards: 8, shard: 6 }
          - { pkg: ./internal/server, shards: 8, shard: 7 }
          - { pkg: ./internal/server, shards: 8, shard: 8 }
          - { pkg: ./internal/machine, shards: 3, shard: 1 }
          - { pkg: ./internal/machine, shards: 3, shard: 2 }
          - { pkg: ./internal/machine, shards: 3, shard: 3 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - run: |
          run=$(scripts/ci-shard.sh ${{ matrix.pkg }} ${{ matrix.shards }} ${{ matrix.shard }} -- -race)
          NEXTBOARD_SSHD_TEST=1 go test -race -count=1 -timeout 30m -run "$run" ${{ matrix.pkg }}

  # Before any tag exists: a broken build must not leave a version without a release.
  build:
    name: go vet and trial goreleaser build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      # A build cache of this run's own, saved when the job ends: the release job starts from it,
      # so goreleaser there finds this commit already compiled for every target.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: go-build-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go vet ./...
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true
      - run: goreleaser check
      - run: goreleaser release --snapshot --clean --skip=publish

  release:
    needs: [web, go, shard, build]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/beta'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-build-${{ runner.os }}-${{ github.run_id }}
          restore-keys: go-build-${{ runner.os }}-
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true
      - run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix "$RUNNER_TEMP/sr" semantic-release@25.0.9 @semantic-release/exec@7.1.0 conventional-changelog-conventionalcommits@10.4.1
      - run: |
          "$RUNNER_TEMP/sr/node_modules/.bin/semantic-release" ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
